buildscript {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:1.6-SNAPSHOT"
    }
}

plugins {
    id 'maven-publish'
}

apply plugin: 'fabric-loom'

version = "1.0.0"
group = "net.astral"

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings "net.fabricmc:yarn:1.20.1+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.15.7"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.91.1+1.20.1"
}

java {
    withSourcesJar()
}
