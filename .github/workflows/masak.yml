name: Masak-Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Fix Wrapper (Download Jar Otomatis)
        run: |
          mkdir -p gradle/wrapper
          gradle wrapper --gradle-version 8.3

      - name: Kasih Izin & Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload Hasil Jadi
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Astral-Hold
          path: build/libs/*.jar
