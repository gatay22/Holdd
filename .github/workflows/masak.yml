name: Masak-Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'
      
      # Ini bagian penting buat nyiapin file yang ilang tadi
      - name: Setup Gradle
        run: |
          ./gradlew wrapper --gradle-version 8.4
          chmod +x gradlew
          
      - name: Build
        run: ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: Mod-Astral-Hold
          path: build/libs/*.jar
