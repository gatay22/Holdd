name: Masak-Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      # Kita pakai gradle sistem langsung, bypass gradlew yang rewel
      - name: Build Mod
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: Mod-Astral-Hold
          path: build/libs/*.jar
