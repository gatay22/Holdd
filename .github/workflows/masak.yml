name: Masak-Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Force Generate Wrapper (Tanpa Gradlew)
        run: |
          # Kita pakai gradle asli milik sistem Ubuntu buat bikin kuncinya
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Build Mod
        run: ./gradlew build

      - name: Upload Hasil Jadi
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Astral-Hold
          path: build/libs/*.jar
